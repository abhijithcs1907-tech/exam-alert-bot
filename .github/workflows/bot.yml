name: Exam Alert Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-exams:
    runs-on: ubuntu-latest

    steps:
      - name: Get bot code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 twilio

      - name: Test Hyderabad checker
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: python main.py

      - name: Test Coimbatore checker
        run: python coimbatore_checker.py

      - name: Save exam state
        run: |
          git config user.name "exam-alert-bot"
          git config user.email "exam-alert-bot@users.noreply.github.com"
          git add exam_state.json
          git diff --cached --quiet || git commit -m "Update exam state"
          git push
